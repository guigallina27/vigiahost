version: "2"

linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - nilerr
  settings:
    errcheck:
      # Erros que não mudam o resultado: prazos de conexão já encerrada e fechamento em defer.
      exclude-functions:
        - (net.Conn).SetDeadline
        - (net.Conn).SetReadDeadline
        - (net.Conn).SetWriteDeadline
        - (net.Conn).Close
        - (net.Listener).Close
        - (*database/sql.DB).Close
        - (*github.com/guigallina27/vigiahost/internal/ipc.Client).Close
    gosec:
      excludes:
        # Coberto pelo errcheck, que respeita a lista de exceções acima.
        - G104
  exclusions:
    rules:
      # Testes usam caminhos e permissões de arquivos temporários de propósito.
      - path: _test\.go
        linters: [gosec, errcheck, noctx]
      # Ferramentas de laboratório (gerador de corpus, cenários): rodam como root numa máquina descartável, com
      # caminhos e comandos dados por quem as executa, e sorteio determinístico de propósito. O G116 (Trojan Source)
      # continua valendo: nomes bidi do corpus ficam escritos como escape (\u202e).
      - path: ^test/
        linters: [gosec]
        text: "G(115|204|301|302|304|306|404|702)"
      - path: ^test/
        linters: [noctx]

formatters:
  enable:
    - gofmt
