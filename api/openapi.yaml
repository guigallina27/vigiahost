    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, at, actor, action, target, detail, ip]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        detail: { type: string }
        ip: { type: string }
    AuditPage:
      type: object
      additionalProperties: false
